global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files: [rules.yml]

scrape_configs:
  # Every container in this Compose project that has the metrics port.
  - job_name: kev-check
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: [com.docker.compose.project=kev-check]
    relabel_configs:
      - source_labels: [__meta_docker_port_private]
        regex: "9568"
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: /(.+)
        target_label: pod
      - source_labels: [__meta_docker_container_label_env]
        target_label: env
