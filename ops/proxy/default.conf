# localhost:8080 for the laptop, spread across every app container like a load balancer.
server {
  listen 8080;

  # Docker's DNS. A variable in proxy_pass makes nginx look the name up again every
  # 5 seconds, so containers added by `make scale` join the rotation.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $app http://app:4000;

  location / {
    proxy_pass $app;
  }
}
